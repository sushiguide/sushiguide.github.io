<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Суші Гід Хмельницький</title>
  <meta name="description" content="Чесний рейтинг суші в Хмельницькому. Зважування, кількість лосося, ціна за 100 г та оцінка за 5 категоріями. Незалежна дегустація 2026.">

  <meta property="og:description" content="Чесний рейтинг суші в Хмельницькому. Зважування, кількість лосося, ціна за 100 г та оцінка за 5 категоріями.">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:description" content="Чесний рейтинг суші в Хмельницькому. Зважування, кількість лосося, ціна за 100 г та оцінка за 5 категоріями.">
  <meta name="twitter:image" content="https://sushiguide.github.io/og-image.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script async src="https://tally.so/widgets/embed.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    .modal { display: none; }
    .modal.open { display: flex; }
    .bar { height: 6px; border-radius: 3px; background: #e5e7eb; overflow: hidden; }
    .bar > div { height: 100%; border-radius: 3px; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col">

<!-- ========== HEADER (завжди) ========== -->
<header class="bg-zinc-900 text-white">
  <div class="max-w-6xl mx-auto px-4 py-14 text-center">
    <div class="inline-flex items-center gap-2 bg-red-600/20 text-red-400 text-sm font-medium px-3 py-1 rounded-full mb-5">
      <i class="fa-solid fa-fish"></i> Незалежна дегустація · 2026
    </div>
    <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Суші Гід Хмельницький</h1>
    <p class="text-lg text-zinc-300 max-w-xl mx-auto">
      Чесний гід по суші міста. Зважування, кількість лосося, ціна за 100 г та оцінка за 5 категоріями.
    </p>
  </div>
</header>

<!-- ========== CONTENT (підвантажується) ========== -->
<div id="app" class="flex-1">
  <div class="text-center py-20 text-zinc-400">Завантаження...</div>
</div>

<!-- ========== FOOTER (завжди) ========== -->
<footer class="bg-zinc-900 text-zinc-400 py-8 text-center text-sm">
  Суші Гід Хмельницький · Незалежна дегустація ·
  <a href="#tally-open=xX1kVE&tally-emoji-text=🍣&tally-emoji-animation=wave"
     class="text-zinc-400 hover:text-zinc-200 transition-colors">
    Запропонувати новий заклад
  </a>
  <div class="mt-3 text-[10px] text-zinc-500">Останнє оновлення: 5 серпня 2026</div>
</footer>

<script>
/* =====================================================
   РЕЖИМ САЙТУ
   Зміни на 'coming-soon' щоб показати заглушку
   ===================================================== */
const MODE = 'rating';   // 'rating' | 'coming-soon'

/* ===================================================== */

let places = [];

async function loadContent() {
  const file = MODE === 'coming-soon'
    ? 'content/coming-soon.html'
    : 'content/rating.html';

  try {
    const res = await fetch(file);
    if (!res.ok) throw new Error('Content not found');
    const html = await res.text();
    document.getElementById('app').innerHTML = html;

    if (MODE === 'rating') {
      await loadData();
      bindFilters();
    }
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="text-center py-20 text-red-500">
        Не вдалося завантажити контент.<br>
        <span class="text-sm text-zinc-400">${e.message}</span>
      </div>`;
  }
}

async function loadData() {
  const res = await fetch('data.json');
  places = await res.json();
  render();
}

function getScore(p) {
  // підтримка і нового score, і старого khmelScore
  const s = p.score != null ? p.score : p.khmelScore;
  return s != null ? Number(s) : null;
}

function scoreColor(s) {
  if (s == null) return 'bg-zinc-200 text-zinc-500';
  if (s >= 80) return 'bg-green-100 text-green-800';
  if (s >= 65) return 'bg-lime-100 text-lime-800';
  if (s >= 50) return 'bg-yellow-100 text-yellow-800';
  return 'bg-red-100 text-red-800';
}

function recBadge(r) {
  if (r === 'Так') return '<span class="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">Рекомендую</span>';
  if (r === 'Якщо близько') return '<span class="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Можна спробувати</span>';
  if (r === 'Ні') return '<span class="text-xs px-2 py-0.5 rounded-full bg-zinc-100 text-zinc-500">Не рекомендую</span>';
  return '';
}

function incompleteBadge(p) {
  if (p.incomplete) return '<span class="text-xs px-2 py-0.5 rounded-full bg-orange-100 text-orange-800">Часткові дані</span>';
  return '';
}

function bar(val, max) {
  if (val == null) return '<div class="bar"><div style="width:0%"></div></div>';
  const pct = Math.min(100, (val / max) * 100);
  return `<div class="bar"><div class="bg-green-500" style="width:${pct}%"></div></div>`;
}

function render() {
  const searchEl = document.getElementById('search');
  const recEl = document.getElementById('filterRec');
  const catEl = document.getElementById('filterCat');
  const sortEl = document.getElementById('sortBy');
  if (!searchEl) return;

  const q = searchEl.value.toLowerCase();
  const rec = recEl.value;
  const cat = catEl.value;
  const sort = sortEl.value;

  let list = places.filter(p => {
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (rec && p.recommend !== rec) return false;
    if (cat && p.category !== cat) return false;
    return true;
  });

  list.sort((a, b) => {
    if (sort === 'name') return a.name.localeCompare(b.name, 'uk');
    if (sort === 'price') return (a.price || 9999) - (b.price || 9999);
    return (getScore(b) || 0) - (getScore(a) || 0);
  });

  document.getElementById('countLabel').textContent = `Показано ${list.length} з ${places.length} закладів`;

  document.getElementById('grid').innerHTML = list.map(p => {
    const total = getScore(p);
    const score = total != null ? total.toFixed(0) : '—';
    const a = p.categories.A_taste != null ? p.categories.A_taste.toFixed(0) : '—';
    const b = p.categories.B_value != null ? p.categories.B_value.toFixed(0) : '—';
    const c = p.categories.C_completeness != null ? p.categories.C_completeness.toFixed(1) : '—';
    const d = p.categories.D_service != null ? p.categories.D_service.toFixed(0) : '—';
    const e = p.categories.E_delivery != null ? p.categories.E_delivery.toFixed(0) : '—';
    return `
    <div class="card bg-white rounded-xl border p-5 cursor-pointer" onclick="openModal(${p.id})">
      <div class="flex justify-between items-start gap-3 mb-3">
        <div class="min-w-0">
          <h3 class="font-bold text-lg leading-tight truncate">${p.name}</h3>
          <div class="text-xs text-zinc-500 mt-1">${p.category || p.type || ''}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-3xl font-extrabold ${scoreColor(total)} px-2.5 py-1 rounded-xl">${score}</div>
                  </div>
      </div>
      <div class="flex flex-wrap gap-1.5 mb-4">
        ${recBadge(p.recommend)}
        ${incompleteBadge(p)}
        ${p.price ? `<span class="text-xs px-2 py-0.5 rounded-full bg-zinc-100">${p.price} грн</span>` : ''}
      </div>
      <div class="grid grid-cols-5 gap-2 text-center text-[11px] text-zinc-500 border-t pt-3">
        <div><div class="font-bold text-zinc-800 text-sm">${a}</div><div>Смак</div></div>
        <div><div class="font-bold text-zinc-800 text-sm">${b}</div><div>Цінність</div></div>
        <div><div class="font-bold text-zinc-800 text-sm">${c}</div><div>Додатки</div></div>
        <div><div class="font-bold text-zinc-800 text-sm">${d}</div><div>Сервіс</div></div>
        <div><div class="font-bold text-zinc-800 text-sm">${e}</div><div>Пакування</div></div>
      </div>
    </div>`;
  }).join('');
}

function openModal(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  document.getElementById('mTitle').textContent = p.name;
  const cat = p.categories;
  document.getElementById('mBody').innerHTML = `
    <div class="flex items-center gap-3 mb-5">
      <div class="text-4xl font-extrabold ${scoreColor(getScore(p))} px-3 py-1 rounded-xl">
        ${getScore(p) != null ? getScore(p).toFixed(0) : '—'}
      </div>
      <div>
        <div class="font-medium text-lg">Оцінка</div>
        <div class="text-sm text-zinc-500">${p.category || ''} · ${p.type || ''}</div>
        <div class="mt-1 flex flex-wrap gap-1.5">${recBadge(p.recommend)}${incompleteBadge(p)}</div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3 text-sm mb-5">
      <div class="bg-zinc-50 rounded-lg p-3">
        <div class="text-zinc-500 text-xs">Ціна</div>
        <div class="font-semibold">${p.price ? p.price + ' грн' : '—'}</div>
      </div>
      <div class="bg-zinc-50 rounded-lg p-3">
        <div class="text-zinc-500 text-xs">Вага (факт / заявл.)</div>
        <div class="font-semibold">${p.actualWeight ?? '—'} / ${p.declaredWeight ?? '—'} г</div>
      </div>
      <div class="bg-zinc-50 rounded-lg p-3">
        <div class="text-zinc-500 text-xs">Ціна за 100 г</div>
        <div class="font-semibold">${p.pricePer100g != null ? p.pricePer100g + ' грн' : '—'}</div>
      </div>
      <div class="bg-zinc-50 rounded-lg p-3">
        <div class="text-zinc-500 text-xs">Лосось</div>
        <div class="font-semibold">${p.salmonPct != null ? p.salmonPct + '%' : '—'} ${p.salmonG ? '(' + p.salmonG + ' г)' : ''}</div>
      </div>
    </div>

    <h4 class="font-bold text-sm mb-3">Оцінка за 5 категоріями</h4>
    <div class="space-y-3 text-sm mb-5">
      ${catRow('Смак', cat.A_taste, 50)}
      ${catRow('Цінність і чесність', cat.B_value, 20)}
      ${catRow('Додатки', cat.C_completeness, 5)}
      ${catRow('Сервіс', cat.D_service, 15)}
      ${catRow('Пакування', cat.E_delivery, 10)}
    </div>

    ${p.menu ? `<a href="${p.menu}" target="_blank" class="inline-block mt-1 text-sm text-blue-600 hover:underline">Меню закладу →</a>` : ''}
  `;
  document.getElementById('modal').classList.add('open');
}

function catRow(label, val, max) {
  const v = val != null ? (Number.isInteger(val) ? val : val.toFixed(1)) : '—';
  return `<div class="flex items-center gap-3">
    <div class="w-44 text-zinc-600 shrink-0">${label}</div>
    <div class="flex-1">${bar(val, max)}</div>
    <div class="w-14 text-right font-semibold">${v}<span class="text-zinc-400 font-normal text-xs">/${max}</span></div>
  </div>`;
}

function closeModal() {
  const m = document.getElementById('modal');
  if (m) m.classList.remove('open');
}

function bindFilters() {
  ['search', 'filterRec', 'filterCat', 'sortBy'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    }
  });
  document.addEventListener('click', e => {
    if (e.target.id === 'modal') closeModal();
  });
}

loadContent();
</script>
</body>
</html>
