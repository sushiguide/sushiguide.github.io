name: Update sushi data

on:
  schedule:
    # Once daily ~23:00 Kyiv
    # Summer (EEST, UTC+3) → 20:00 UTC; winter (EET, UTC+2) → same cron = 22:00 Kyiv
    - cron: "0 20 * * *"
  workflow_dispatch:  # optional manual run from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert CSV → data.json
        run: |
          python scripts/convert_csv.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes in data.json"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "data.json changed"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update data.json from Google Sheets"
          git push
