<!-- Filters -->
<div class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b">
  <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap gap-2 items-center">
    <input id="search" type="text" placeholder="Пошук закладу..."
           class="flex-1 min-w-[160px] px-3 py-2 text-sm border rounded-lg focus:outline-none focus:ring-2 focus:ring-zinc-400">
    <select id="filterRec" class="px-3 py-2 text-sm border rounded-lg bg-white">
      <option value="">Всі рекомендації</option>
      <option value="Так">Рекомендую</option>
      <option value="Якщо близько">Якщо близько</option>
      <option value="Ні">Не рекомендую</option>
    </select>
    <select id="filterCat" class="px-3 py-2 text-sm border rounded-lg bg-white">
      <option value="">Всі категорії</option>
      <option value="Преміум">Преміум</option>
      <option value="Вище середнього">Вище середнього</option>
      <option value="Середній">Середній</option>
      <option value="Бюджет">Бюджет</option>
    </select>
    <select id="sortBy" class="px-3 py-2 text-sm border rounded-lg bg-white">
      <option value="score">За Khmel Score</option>
      <option value="name">За назвою</option>
      <option value="price">За ціною</option>
    </select>
  </div>
</div>

<main class="max-w-6xl mx-auto px-4 py-6">
  <div class="flex justify-between items-center mb-4 text-sm text-zinc-500">
    <span id="countLabel">Завантаження...</span>
    <span class="text-xs">Оцінки за системою Khmel Score (A–E)</span>
  </div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>

<!-- Modal -->
<div id="modal" class="modal fixed inset-0 z-50 items-center justify-center p-4 bg-black/60">
  <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-2xl">
    <div class="sticky top-0 bg-white border-b px-5 py-4 flex justify-between items-center">
      <h3 id="mTitle" class="font-bold text-lg"></h3>
      <button onclick="closeModal()" class="text-2xl leading-none text-zinc-400 hover:text-zinc-700">&times;</button>
    </div>
    <div id="mBody" class="p-5"></div>
  </div>
</div>
